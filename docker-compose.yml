version: "2.1"
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=[YOUR TIMEZONE]
    volumes:
      - /path/to/sonarr-config:/config
      - /path/to/tvseries:/tv
      - /path/to/downloadclient-downloads:/downloads
    ports:
      - 8989:8989
    networks:
      mediamacvlan:
       ipv4_address: [IP ADDRESS]
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin:10.8.9
    container_name: jellyfin
    networks:
      mediamacvlan:
       ipv4_address: [IP ADDRESS]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=[YOUR TIMEZONE]
    volumes:
      - /path/to/jellyfin-config:/config
      - /path/to/tvseries:/tv
      - /path/to/movies:/movies
      - /path/to/downloadclient-downloads:/data
  # devices:
   #  - /dev/videoN:/dev/videoN # Mount GPU device 
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 8920:8920
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
     - PUID=1000
     - PGID=1000
     - TZ=Etc/UTC
     - WEBUI_PORT=8080
    volumes:
      - /path/to/qbittorrent/config:/config
      - /path/to/downloadclient-downloads:/downloads
    ports:
     - 8080:8080
     - 6881:6881
     - 6881:6881/udp
    restart: unless-stopped
    networks:
      mediamacvlan:
       ipv4_address: [IP ADDRESS]

  requestrr:
    image: lscr.io/linuxserver/requestrr:latest
    container_name: requestrr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=[YOUR TIMEZONE]
    volumes:
      - /path/to/requestrr/config:/config
    ports:
      - 4545:4545
    networks:
      mediamacvlan:
       ipv4_address: [IP ADDRESS]
    restart: unless-stopped
  
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=[YOUR TIMEZONE]
    volumes:
      - /path/to/radarr-config:/config
      - /path/to/movies:/movies
      - /path/to/downloadclient-downloads:/downloads
    ports:
      - 7878:7878
    networks:
      mediamacvlan:
       ipv4_address: [IP ADDRESS]
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=[YOUR TIMEZONE]
    volumes:
      - /path/to/prowlarr/config:/config
    ports:
      - 9696:9696
    networks:
      mediamacvlan:
       ipv4_address: [IP ADDRESS]
    restart: unless-stopped

networks:
  mediamacvlan:
    external: true
    name: mediamacvlan

