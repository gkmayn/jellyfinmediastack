version: "2.1"
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    networks:
      dockervlan:
       ipv4_address: [IP ADDRESS]
    volumes:
      - /path/to/sonarr.config:/config
      - /path/to/tvseries:/tv #optional
      - /path/to/downloadclient-downloads:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin:10.8.9
    container_name: jellyfin
    networks:
      dockervlan:
       ipv4_address: [IP ADDRESS]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - jellyfin-config:/config
      - torrent-downloads:/data
  # devices:
   #  - /dev/videoN:/dev/videoN # Mount GPU device 
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 8920:8920
    restart: unless-stopped

volumes:
  torrent-downloads:
  radarr-config:
  sonarr-config:
  jackett-config:
  jackett-blackhole:
  prowlarr-config:
  qbittorrent-config:
  tx-config:
  tx-watch:

networks:
  [MACVLAN NAME]:
    name: [MACVLAN NAME]
    driver: macvlan
    driver_opts:
      parent: [NETWORD ADAPTER NAME]

